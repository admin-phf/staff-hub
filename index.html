<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ea">
  <title>Prahran Health Foods — Current Specials</title>
  <style>
    :root {
      --ink: #17201b;
      --muted: #69736c;
      --green: #355845;
      --green-2: #55745f;
      --cream: #f4f2ea;
      --paper: #fff;
      --red: #bd3d4b;
      --line: #dfe3dd;
      --shadow: 0 14px 35px rgba(28,44,35,.10);
      --radius: clamp(18px,2vw,34px);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      background: var(--cream);
      font-family: Inter, Avenir Next, Avenir, Montserrat, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    .app { width: 100%; height: 100%; position: relative; isolation: isolate; }
    .slide {
      width: 100%; height: 100%; position: absolute; inset: 0;
      display: grid; opacity: 0; pointer-events: none;
      transform: scale(1.012); transition: opacity .55s ease, transform .7s ease;
      background:
        radial-gradient(circle at 6% 6%, rgba(95,124,97,.11) 0 1.5%, transparent 1.7%),
        radial-gradient(circle at 94% 92%, rgba(189,61,75,.08) 0 1.2%, transparent 1.4%),
        var(--cream);
    }
    .slide.is-active { opacity: 1; pointer-events: auto; transform: none; }
    .frame { width: 100%; height: 100%; padding: clamp(20px,3.4vw,66px); display: grid; }
    .header { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
    .eyebrow { margin: 0 0 .3em; font-size: clamp(12px,1.15vw,22px); font-weight: 800; letter-spacing: .18em; color: var(--green); }
    h1 { margin: 0; font-size: clamp(34px,4.25vw,84px); line-height: .91; letter-spacing: -.055em; font-weight: 900; }
    .subhead { margin: .55em 0 0; color: var(--muted); font-size: clamp(13px,1.2vw,23px); font-weight: 600; }
    .brandmark { text-align: right; color: var(--green); font-size: clamp(13px,1.25vw,24px); font-weight: 900; letter-spacing: .055em; line-height: 1.05; }
    .brandmark small { display: block; margin-top: .35em; color: var(--muted); font-size: .55em; letter-spacing: .18em; font-weight: 700; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 24px; color: var(--muted); font-size: clamp(10px,.72vw,14px); }
    .footer strong { color: var(--green); font-size: 1.12em; }
    .cards { display: grid; min-height: 0; }
    .card {
      min-width: 0; min-height: 0; overflow: hidden; position: relative;
      background: rgba(255,255,255,.97); border: 1px solid rgba(53,88,69,.10);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .product-image { width: 100%; height: 100%; object-fit: contain; display: block; mix-blend-mode: multiply; }
    .brand { color: var(--green); font-weight: 900; letter-spacing: .13em; text-transform: uppercase; }
    .name { margin: .35em 0 0; font-weight: 850; line-height: 1.06; letter-spacing: -.026em; }
    .now-label { display: inline-flex; width: fit-content; color: white; background: var(--green); border-radius: 999px; padding: .32em .7em .27em; font-weight: 900; letter-spacing: .12em; }
    .price { margin: .06em 0; font-weight: 950; line-height: .88; letter-spacing: -.07em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .was { color: var(--muted); font-weight: 700; }
    .was s { text-decoration-thickness: .12em; }
    .save { display: inline-flex; width: fit-content; color: white; background: var(--red); border-radius: 999px; padding: .45em .78em .4em; font-weight: 900; letter-spacing: .035em; white-space: nowrap; }
    .deal { color: var(--green); font-weight: 950; line-height: .94; letter-spacing: -.045em; text-wrap: balance; }
    .deal .deal-small { display: block; font-size: .48em; letter-spacing: .035em; margin-bottom: .2em; }
    .image-fallback { width: 100%; height: 100%; display: grid; place-items: center; color: #9ba49e; text-align: center; font-weight: 800; padding: 16%; background: linear-gradient(145deg,#fff,#f3f4ef); }

    /* Primary checkout display: four fast-glance cards. */
    .checkout .frame { grid-template-rows: auto minmax(0,1fr) auto; gap: clamp(15px,2vw,34px); }
    .checkout .cards { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: clamp(14px,1.5vw,28px); }
    .checkout .card { display: grid; grid-template-columns: 41% 59%; padding: clamp(14px,1.5vw,30px); }
    .checkout .visual { min-width: 0; min-height: 0; padding: 3%; }
    .checkout .copy { min-width: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 2% 3% 2% 5%; }
    .checkout .brand { font-size: clamp(10px,.72vw,15px); }
    .checkout .name { font-size: clamp(18px,1.55vw,31px); }
    .checkout .now-label { margin-top: clamp(9px,.8vw,16px); font-size: clamp(9px,.68vw,14px); }
    .checkout .price { font-size: clamp(46px,4.4vw,88px); }
    .checkout .was { font-size: clamp(12px,1vw,20px); }
    .checkout .save { margin-top: .58em; font-size: clamp(11px,.82vw,17px); }
    .checkout .deal { margin-top: .35em; font-size: clamp(33px,3.15vw,64px); }

    /* Full-screen feature product. */
    .hero .frame { grid-template-rows: auto minmax(0,1fr) auto; gap: clamp(14px,2vw,34px); }
    .hero .card { display: grid; grid-template-columns: 48% 52%; padding: clamp(22px,3vw,60px); background: #fff; }
    .hero .visual { min-height: 0; padding: 2%; }
    .hero .copy { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 7%; }
    .hero .brand { font-size: clamp(13px,1.3vw,26px); }
    .hero .name { max-width: 13em; font-size: clamp(31px,3.25vw,66px); }
    .hero .now-label { margin-top: 1.3em; font-size: clamp(11px,.9vw,18px); }
    .hero .price { font-size: clamp(80px,9.5vw,190px); }
    .hero .was { font-size: clamp(17px,1.7vw,34px); }
    .hero .save { margin-top: .7em; font-size: clamp(15px,1.4vw,28px); }
    .hero .deal { margin-top: .5em; max-width: 11em; font-size: clamp(62px,7vw,140px); }

    /* Tall customer display. */
    .portrait .frame { padding: 5.5% 5%; grid-template-rows: auto minmax(0,1fr) auto; gap: 2.2%; }
    .portrait .header { align-items: start; }
    .portrait h1 { font-size: clamp(42px,7vh,92px); }
    .portrait .brandmark { display: none; }
    .portrait .cards { grid-template-columns: 1fr; grid-template-rows: repeat(3,1fr); gap: 1.6%; }
    .portrait .card { display: grid; grid-template-columns: 39% 61%; padding: 3.2%; }
    .portrait .visual { min-height: 0; }
    .portrait .copy { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 6%; }
    .portrait .brand { font-size: clamp(12px,1.4vh,20px); }
    .portrait .name { font-size: clamp(22px,2.65vh,40px); }
    .portrait .now-label { margin-top: .8em; font-size: clamp(10px,1.05vh,16px); }
    .portrait .price { font-size: clamp(58px,7.3vh,112px); }
    .portrait .was { font-size: clamp(15px,1.7vh,26px); }
    .portrait .save { margin-top: .55em; font-size: clamp(12px,1.4vh,21px); }
    .portrait .deal { margin-top: .35em; font-size: clamp(42px,5.2vh,80px); }

    /* Wide banner / email masthead. */
    .banner .frame { padding: 4%; grid-template-columns: 22% minmax(0,1fr); gap: 3.5%; }
    .banner .header { align-items: flex-start; flex-direction: column; justify-content: center; }
    .banner .brandmark { text-align: left; }
    .banner .cards { grid-template-columns: repeat(3,1fr); gap: 2%; }
    .banner .card { display: grid; grid-template-columns: 43% 57%; padding: 4%; }
    .banner .visual { min-height: 0; }
    .banner .copy { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding-left: 7%; }
    .banner h1 { font-size: clamp(30px,3.5vw,70px); }
    .banner .subhead { font-size: clamp(12px,1.05vw,21px); }
    .banner .brand { font-size: clamp(8px,.6vw,12px); }
    .banner .name { font-size: clamp(14px,1.2vw,24px); }
    .banner .now-label { margin-top: .8em; font-size: clamp(8px,.55vw,11px); }
    .banner .price { font-size: clamp(36px,3.4vw,68px); }
    .banner .was { font-size: clamp(10px,.8vw,16px); }
    .banner .save { margin-top: .5em; font-size: clamp(9px,.67vw,13px); }
    .banner .deal { margin-top: .4em; font-size: clamp(28px,2.65vw,53px); }
    .banner .footer { display: none; }

    /* 800 x 800 social / Mailchimp tile. */
    .square { background: var(--cream); }
    .square .frame { width: min(100vw,100vh); height: min(100vw,100vh); margin: auto; padding: 5%; grid-template-rows: auto minmax(0,1fr) auto; gap: 3%; }
    .square .header { align-items: center; }
    .square h1 { font-size: clamp(34px,6.3vmin,72px); }
    .square .subhead, .square .brandmark small { display: none; }
    .square .card { display: grid; grid-template-rows: 56% 44%; padding: 4.5%; }
    .square .visual { min-height: 0; }
    .square .copy { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; text-align: center; }
    .square .brand { font-size: clamp(11px,1.55vmin,18px); }
    .square .name { font-size: clamp(22px,3.25vmin,38px); margin-top: .15em; }
    .square .now-label { margin-top: .55em; font-size: clamp(9px,1.25vmin,15px); }
    .square .price { font-size: clamp(61px,10.5vmin,122px); }
    .square .was { font-size: clamp(14px,2.05vmin,24px); }
    .square .save { position: absolute; right: 4.5%; top: 4.5%; width: clamp(88px,15vmin,170px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; padding: 7%; white-space: normal; text-align: center; font-size: clamp(12px,1.9vmin,22px); transform: rotate(5deg); }
    .square .deal { margin-top: .45em; font-size: clamp(44px,7.1vmin,82px); }
    .square .footer { justify-content: center; font-size: clamp(9px,1.35vmin,15px); }
    .square .footer span:last-child { display: none; }

    .controls { position: fixed; right: 16px; bottom: 16px; z-index: 20; display: flex; gap: 8px; opacity: 0; transition: opacity .2s; }
    body:hover .controls, .controls:focus-within { opacity: 1; }
    .controls button { width: 42px; height: 42px; border: 0; border-radius: 50%; color: white; background: rgba(23,32,27,.72); cursor: pointer; }
    .controls button:hover { background: var(--green); }
    .status { position: fixed; left: 50%; bottom: 17px; z-index: 30; transform: translateX(-50%); color: white; background: rgba(23,32,27,.86); border-radius: 999px; padding: 9px 16px; font-weight: 750; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s; }
    .status.show { opacity: 1; }
    .error { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: var(--cream); }
    .error > div { max-width: 720px; background: white; border-radius: 24px; padding: 34px; box-shadow: var(--shadow); }
    .error h2 { margin: 0 0 12px; }
    .error p { line-height: 1.55; }
    .error code { word-break: break-all; }

    @media (max-aspect-ratio: 4/5) {
      .checkout .cards { grid-template-columns: 1fr; grid-template-rows: repeat(4,1fr); }
      .checkout .card { grid-template-columns: 38% 62%; }
      .checkout .price { font-size: clamp(40px,7vw,72px); }
      .checkout .brandmark { display: none; }
    }
    @media print {
      @page { margin: 0; size: landscape; }
      .controls, .status { display: none !important; }
      .slide { position: fixed; opacity: 0 !important; }
      .slide.is-active { opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>
  <div class="controls" aria-label="Slide controls">
    <button id="prev" title="Previous (left arrow)" aria-label="Previous slide">&#8592;</button>
    <button id="pause" title="Pause or play (space)" aria-label="Pause slideshow">&#10074;&#10074;</button>
    <button id="next" title="Next (right arrow)" aria-label="Next slide">&#8594;</button>
    <button id="full" title="Full screen (F)" aria-label="Full screen">&#x26F6;</button>
  </div>
  <div id="status" class="status"></div>

  <script>
    'use strict';

    /* -----------------------------------------------------------------------
       ONLY EDIT THIS SECTION.

       1. Put the ID from your Google Sheet address into SHEET_ID.
       2. Put the tab's gid into SHEET_GID (usually 0).
       3. In Google Sheets choose Share > General access > Anyone with the link.

       The required headings are:
       brand,name,now_price,discount_style,discount_value,active,image_id,image_url
       -------------------------------------------------------------------- */
    const CONFIG = {
      SHEET_ID: 'PASTE_YOUR_GOOGLE_SHEET_ID_HERE',
      SHEET_GID: '0',
      ROTATE_SECONDS: 9,
      DEFAULT_LAYOUT: 'checkout', // checkout, hero, portrait, banner, square, auto
      HEADING: 'CURRENT SPECIALS',
      SUBHEADING: 'SELECTED PRODUCTS ON SALE',
      STORE_NAME: 'PRAHRAN HEALTH FOODS',
      STORE_LINE: 'REAL FOODS. REAL HEALTH.',
      DISCLAIMER: '*Not valid in conjunction with existing specials or any other offer. While stocks last.'
    };

    const params = new URLSearchParams(location.search);
    const layout = normaliseLayout(params.get('layout') || CONFIG.DEFAULT_LAYOUT);
    const sheetId = params.get('sheet') || CONFIG.SHEET_ID;
    const gid = params.get('gid') || CONFIG.SHEET_GID;
    const rotateMs = Math.max(3, Number(params.get('seconds')) || CONFIG.ROTATE_SECONDS) * 1000;
    const requestedProduct = Math.max(0, (Number(params.get('product')) || 1) - 1);
    const app = document.getElementById('app');
    const status = document.getElementById('status');
    let slides = [];
    let index = 0;
    let timer = null;
    let paused = false;

    function normaliseLayout(value) {
      const valid = ['checkout','hero','portrait','banner','square','auto'];
      value = String(value || '').toLowerCase();
      return valid.includes(value) ? value : 'checkout';
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], field = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"' && quoted && next === '"') { field += '"'; i++; }
        else if (ch === '"') quoted = !quoted;
        else if (ch === ',' && !quoted) { row.push(field); field = ''; }
        else if ((ch === '\n' || ch === '\r') && !quoted) {
          if (ch === '\r' && next === '\n') i++;
          row.push(field); field = '';
          if (row.some(cell => cell.trim() !== '')) rows.push(row);
          row = [];
        } else field += ch;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      const headers = (rows.shift() || []).map(x => x.trim().toLowerCase().replace(/^\ufeff/,''));
      return rows.map(values => Object.fromEntries(headers.map((key, i) => [key, (values[i] || '').trim()])));
    }

    function isActive(value) {
      return ['yes','y','true','1','active'].includes(String(value).trim().toLowerCase());
    }

    function numberOrNull(value) {
      const cleaned = String(value ?? '').replace(/[$,\s]/g,'');
      return cleaned !== '' && Number.isFinite(Number(cleaned)) ? Number(cleaned) : null;
    }

    function money(value) {
      const n = numberOrNull(value);
      if (n === null) return '';
      return '$' + n.toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }

    function driveIdFromUrl(url) {
      const value = String(url || '');
      return value.match(/[?&]id=([\w-]+)/)?.[1] || value.match(/\/d\/([\w-]+)/)?.[1] || '';
    }

    function imageSource(item) {
      const url = String(item.image_url || '').trim();
      const id = String(item.image_id || '').trim() || driveIdFromUrl(url);
      if (/drive\.google\.com/i.test(url) && id) return `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`;
      return url || (id ? `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600` : '');
    }

    function prepareItem(raw) {
      const now = numberOrNull(raw.now_price);
      const old = numberOrNull(raw.discount_value);
      const style = String(raw.discount_style || 'none').trim().toLowerCase();
      return {
        ...raw,
        now,
        old,
        style,
        image: imageSource(raw),
        saving: style === 'was' && now !== null && old !== null && old > now ? old - now : null
      };
    }

    function imageHtml(item) {
      if (!item.image) return `<div class="image-fallback">${escapeHtml(item.brand)}<br>${escapeHtml(item.name)}</div>`;
      return `<img class="product-image" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.brand + ' ' + item.name)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;image-fallback&quot;>IMAGE<br>UNAVAILABLE</div>'">`;
    }

    function offerHtml(item) {
      if (item.style === 'deal') {
        const deal = escapeHtml(item.discount_value || 'SPECIAL OFFER');
        const enhanced = deal.replace(/^(BUY\s+\d+)(.*)$/i, '<span class="deal-small">$1</span>$2');
        return `<div class="deal">${enhanced}</div>`;
      }
      const current = item.now !== null ? money(item.now) : escapeHtml(item.now_price || 'SPECIAL');
      let oldLine = '';
      let saveLine = '';
      if (item.style === 'was' && item.old !== null) oldLine = `<div class="was">WAS <s>${money(item.old)}</s></div>`;
      else if (item.discount_value && !['none',''].includes(String(item.discount_value).toLowerCase())) oldLine = `<div class="was">${escapeHtml(item.discount_value)}</div>`;
      if (item.saving !== null) saveLine = `<div class="save">SAVE ${money(item.saving)}</div>`;
      return `<div class="now-label">NOW</div><div class="price">${current}</div>${oldLine}${saveLine}`;
    }

    function cardHtml(item) {
      return `<article class="card">
        <div class="visual">${imageHtml(item)}</div>
        <div class="copy">
          <div class="brand">${escapeHtml(item.brand)}</div>
          <div class="name">${escapeHtml(item.name)}</div>
          ${offerHtml(item)}
        </div>
      </article>`;
    }

    function headerHtml() {
      return `<header class="header">
        <div><p class="eyebrow">${escapeHtml(CONFIG.STORE_NAME)}</p><h1>${escapeHtml(CONFIG.HEADING)}</h1><p class="subhead">${escapeHtml(CONFIG.SUBHEADING)}</p></div>
        <div class="brandmark">PRAHRAN<small>HEALTH FOODS</small></div>
      </header>`;
    }

    function footerHtml() {
      return `<footer class="footer"><span>${escapeHtml(CONFIG.DISCLAIMER)}</span><strong>${escapeHtml(CONFIG.STORE_LINE)}</strong></footer>`;
    }

    function chunk(array, size) {
      const groups = [];
      for (let i = 0; i < array.length; i += size) groups.push(array.slice(i, i + size));
      return groups;
    }

    function slideHtml(type, items, slideNumber) {
      return `<section class="slide ${type}${slideNumber === 0 ? ' is-active' : ''}" data-layout="${type}" aria-hidden="${slideNumber === 0 ? 'false' : 'true'}">
        <div class="frame">${headerHtml()}<div class="cards">${items.map(cardHtml).join('')}</div>${footerHtml()}</div>
      </section>`;
    }

    function makeSlides(items) {
      const definitions = layout === 'auto'
        ? [{type:'checkout', size:4}, {type:'checkout', size:4}, {type:'hero', size:1}]
        : [{type:layout, size:({checkout:4,hero:1,portrait:3,banner:3,square:1})[layout]}];
      if (layout === 'auto') {
        const output = [];
        let cursor = 0, pattern = 0;
        while (cursor < items.length) {
          const def = definitions[pattern % definitions.length];
          output.push({type:def.type, items:items.slice(cursor, cursor + def.size)});
          cursor += def.size; pattern++;
        }
        return output;
      }
      return chunk(items, definitions[0].size).map(group => ({type:definitions[0].type, items:group}));
    }

    function show(nextIndex, announce = true) {
      if (!slides.length) return;
      index = (nextIndex + slides.length) % slides.length;
      slides.forEach((slide, i) => {
        slide.classList.toggle('is-active', i === index);
        slide.setAttribute('aria-hidden', i === index ? 'false' : 'true');
      });
      if (announce) toast(`Slide ${index + 1} of ${slides.length}`);
      restartTimer();
    }

    function restartTimer() {
      clearInterval(timer);
      if (!paused && slides.length > 1) timer = setInterval(() => show(index + 1, false), rotateMs);
    }

    function toast(message) {
      status.textContent = message;
      status.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => status.classList.remove('show'), 1300);
    }

    function togglePause() {
      paused = !paused;
      document.getElementById('pause').innerHTML = paused ? '&#9654;' : '&#10074;&#10074;';
      document.getElementById('pause').setAttribute('aria-label', paused ? 'Play slideshow' : 'Pause slideshow');
      toast(paused ? 'Slideshow paused' : 'Slideshow playing');
      restartTimer();
    }

    async function load() {
      try {
        if (!sheetId || sheetId.includes('PASTE_YOUR')) throw new Error('Add your Google Sheet ID in the CONFIG section near the bottom of index.html.');
        const csvUrl = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq?tqx=out:csv&gid=${encodeURIComponent(gid)}`;
        const response = await fetch(csvUrl, {cache:'no-store'});
        if (!response.ok) throw new Error(`Google Sheets returned ${response.status}. Check that the sheet link is accessible.`);
        const rows = parseCSV(await response.text());
        const required = ['brand','name','now_price','discount_style','discount_value','active','image_id','image_url'];
        const present = rows[0] ? Object.keys(rows[0]) : [];
        const missing = required.filter(key => !present.includes(key));
        if (missing.length) throw new Error(`Missing sheet column${missing.length > 1 ? 's' : ''}: ${missing.join(', ')}`);
        const products = rows.filter(row => isActive(row.active)).map(prepareItem);
        if (!products.length) throw new Error('No active products were found. Put yes in the active column.');
        const groups = makeSlides(products);
        app.innerHTML = groups.map((group, i) => slideHtml(group.type, group.items, i)).join('');
        slides = [...document.querySelectorAll('.slide')];
        const itemsPerSlide = ({checkout:4,hero:1,portrait:3,banner:3,square:1,auto:4})[layout];
        index = Math.min(slides.length - 1, Math.floor(requestedProduct / itemsPerSlide));
        show(index, false);
      } catch (error) {
        app.innerHTML = `<div class="error"><div><h2>Specials could not be loaded</h2><p>${escapeHtml(error.message)}</p><p>The sheet must contain these exact headings:<br><code>brand,name,now_price,discount_style,discount_value,active,image_id,image_url</code></p></div></div>`;
      }
    }

    document.getElementById('prev').addEventListener('click', () => show(index - 1));
    document.getElementById('next').addEventListener('click', () => show(index + 1));
    document.getElementById('pause').addEventListener('click', togglePause);
    document.getElementById('full').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
    addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') show(index - 1);
      if (event.key === 'ArrowRight') show(index + 1);
      if (event.key === ' ') { event.preventDefault(); togglePause(); }
      if (event.key.toLowerCase() === 'f') document.getElementById('full').click();
    });
    document.addEventListener('visibilitychange', () => document.hidden ? clearInterval(timer) : restartTimer());
    load();
  </script>
</body>
</html>
