<body class="phf-page-notices">
<header class="phf-shell-header header-container">
  <a class="phf-shell-logo logo-section" href="../../index.html" aria-label="Return to Staff Hub"><img src="../../assets/img/phf-logo.png?v=16.0.0-20261005-1802" alt="Prahran Health Foods"></a>
  <a class="phf-shell-title center-section phf-shell-home" href="../../index.html" title="Back to Staff Hub" aria-label="Staff Noticeboard — back to Staff Hub"><span class="phf-shell-icon icon-box" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></span><div class="phf-shell-copy title-row"><h1>Staff Noticeboard</h1><p class="phf-shell-version version-text">v1.0.0</p></div></a>
  <div class="phf-shell-meta right-section"><nav class="phf-shell-nav breadcrumbs" aria-label="Breadcrumb"><a href="../../index.html">Staff Hub</a><span aria-hidden="true">›</span><span aria-current="page">Staff Noticeboard</span></nav><p class="phf-shell-updated build-details">Updated 14 Oct 2026 13:00 AEDT</p></div>
</header>
<main class="phf-full ntc-main">
  <section class="ntc-gate" id="ntcGate" hidden></section>
  <section class="ntc-status" id="ntcStatus" hidden></section>
  <section class="ntc-tools" id="ntcTools" hidden>
    <input type="search" id="ntcSearch" placeholder="Search notices by title, summary or content…" aria-label="Search notices">
    <select id="ntcCategory" aria-label="Category"><option value="">All categories</option></select>
    <select id="ntcPriority" aria-label="Priority"><option value="">All priorities</option></select>
    <div class="ntc-seg" role="group" aria-label="Active or archived"><button type="button" class="btn small is-on" data-show="active">Active</button><button type="button" class="btn small" data-show="archived">Archived</button><button type="button" class="btn small" data-show="all">All</button></div>
    <select id="ntcSort" aria-label="Sort"><option value="recent">Most recent first</option><option value="priority">Priority, then recent</option><option value="title">Title A–Z</option></select>
    <button type="button" class="btn small primary" id="ntcAdd">Add notice</button>
  </section>
  <section class="ntc-list" id="ntcList" aria-live="polite"></section>
  <section class="ntc-editor" id="ntcEditor" hidden></section>
</main>
